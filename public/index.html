<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PsychAI — Acceso</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-wrap {
      width: 100%; max-width: 400px; padding: 1rem;
      position: relative; z-index: 1;
    }
    .login-logo {
      display: flex; align-items: center; gap: 12px;
      justify-content: center; margin-bottom: 2.5rem;
    }
    .login-logo .logo-icon { width: 42px; height: 42px; font-size: 20px; }
    .login-logo .logo-text { font-size: 1.6rem; }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
    }
    .login-title {
      font-family: "DM Serif Display", serif;
      font-size: 1.2rem; margin-bottom: 0.25rem;
    }
    .login-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 1.75rem; }
    .login-footer {
      text-align: center; font-size: 12px;
      color: var(--text-dim); margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="login-wrap fade-in">
    <div class="login-logo">
      <div class="logo-icon">🧠</div>
      <span class="logo-text">Psych<span>AI</span></span>
    </div>

    <div class="login-card">
      <p class="login-title">Acceso al sistema</p>
      <p class="login-sub">Ingresa tus credenciales para continuar.</p>

      <div class="field">
        <label>Correo electrónico</label>
        <input type="email" id="email" placeholder="tu@correo.com" autocomplete="email"/>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
      </div>

      <div class="error-box" id="errorBox"></div>

      <button class="btn btn-primary btn-full mt-2" id="btnLogin" onclick="login()">
        Iniciar sesión
      </button>
    </div>

    <p class="login-footer">Sistema de uso exclusivo para profesionales certificados.</p>
  </div>

  <script type="module" src="js/supabase.js"></script>
  <script type="module">
  import '/js/supabase.js';

  // Redirigir si ya hay sesión
  const { data: { session } } = await window._supabase.auth.getSession();
  if (session) window.location.href = 'pacientes.html';

  window.login = async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('btnLogin');

    document.getElementById('errorBox').style.display = 'none';
    if (!email || !password) { showError('Completa todos los campos.'); return; }

    btn.disabled = true;
    btn.textContent = 'Verificando...';

    const { error } = await window._supabase.auth.signInWithPassword({ email, password });

    if (error) {
      showError('Credenciales incorrectas.');
      btn.disabled = false;
      btn.textContent = 'Iniciar sesión';
    } else {
      window.location.href = 'pacientes.html';
    }
  };

  function showError(msg) {
    const box = document.getElementById('errorBox');
    box.textContent = '⚠️ ' + msg;
    box.style.display = 'block';
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') window.login(); });
</script>
</body>
</html>
